policies:
  max_retry_attempts: 3
  require_branch_scope: true
  require_evidence_bundle: true
  require_independent_qa: true
  allow_direct_main_write: false
  allow_self_merge: false
  allowed_escalations: [decision_required, user_action, uat_ready, significant_risk]
