name: Daniel Cognition Qualification

on:
  push:
    branches:
      - rvsc/daniel-golden-engineering-cognition

permissions:
  contents: read

jobs:
  tests:
    name: full-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile controller
        run: python -m compileall -q controller

      - name: Run RVSC tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
